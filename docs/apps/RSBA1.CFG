# Copy to \IC-705\Apps\rsba1\RSBA1.CFG on the SD card (the app creates the folder; the log is RSBA1.LOG there)
IP=192.168.0.221
USER=myuser
PASS=mypassword
# CI-V address in hex, optional (IC-7300MK2 = B6, IC-7300 = 94; normally taken from the radio)
# Comment out the CIV line to get automatic discovery of the remote address
#CIV=94
# Our own CI-V controller address in hex, optional (default E0; 1-2 hex digits, not 00/FD/FE/FF).
# Pick one no other CI-V controller on the same link uses (wfview uses E1, Hamlib and most loggers E0)
CTRL=E6
# Main dial tuning (optional): Hz per step
STEP=10
# Maximum continuous remote PTT in seconds (positive integer, default 120; 0 is invalid)
PTT_TIMEOUT=120
# Remote receive audio into the radio's speaker queue (optional, default off); VOL 0-100 (default 25)
AUDIO=1
VOL=25
# Microphone audio to the remote radio while PTT is held (optional, default off)
# Disable local VOX; use dummy loads and an independent remote TX timeout for first tests
TXAUDIO=1
# Enable USB-to-remote CI-V bridge (optional, default off); 1 = on, 0 = off
USBCIV=1
# Enable USB-to-remote PTT (optional, default off); 1 = on, 0 = off
USBPTT=1
# Answer PC reads from a short-lived cache and share one scope stream on the USB bridge (default on); 0 = forward everything
USBCACHE=1
